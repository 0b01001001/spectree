name: Python Check

on:
  pull_request:
  push:
    branches:
      - master
      - main
  merge_group:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          ignore-nothing-to-cache: true
      - name: Install dependencies
        run: make install
      - name: Lint
        run: make lint

  test:
    runs-on: ${{ matrix.os }}
    env:
      UV_MANAGED_PYTHON: "true"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t", "pypy3.11"]
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          ignore-nothing-to-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        if: ${{ !startsWith(matrix.python-version, 'pypy') }}
        run: make install
      - name: Test
        if: ${{ !startsWith(matrix.python-version, 'pypy') }}
        run: make test
      - name: Test without msgspec
        if: ${{ startsWith(matrix.python-version, 'pypy') }}
        run: make test_common test_pydantic
